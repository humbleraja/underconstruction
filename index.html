<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMBLE RAJA - Under Construction</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Palanquin:wght@700&family=Syncopate:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-image: url('FF Promo TTC 10-EDIT.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fefefe;
            font-family: "Syncopate", sans-serif;
            font-weight: 700;
        }

        /* General font style helpers */
        .syncopate-bold {
            font-family: "Syncopate", sans-serif;
            font-weight: 700;
            font-style: normal;
        }

        .palanquin-bold {
            font-family: "Palanquin", sans-serif;
            font-weight: 700;
            font-style: normal;
        }

        /* Center Image */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .center-container img {
            max-width: 50%;
            height: auto;
            display: block;
        }

        /* Edge Elements */
        .edge-text {
            position: absolute;
            z-index: 3;
            font-size: 9pt; /* 18pt reduced by 30% */
            letter-spacing: 1px;
        }

        /* Top Edge */
        .top-edge {
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Bottom Edge (Kept at 18pt) */
        .bottom-edge {
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12pt; 
        }

        /* Left Edge */
        .left-edge {
            left: 30px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left center;
        }

        /* Right Edge */
        .right-edge {
            right: 30px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            transform-origin: right center;
        }

        /* Links styling */
        a {
            color: #fefefe;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #ffc2d7;
        }
    </style>
</head>
<body>

    <!-- Top Edge: HUMBLE RAJA -->
    <div class="edge-text top-edge syncopate-bold">
        HUMBLE RAJA
    </div>

    <!-- Left Edge: CONTACT -->
    <div class="edge-text left-edge syncopate-bold">
        <a href="mailto:hello@humbleraja.com">CONTACT</a>
    </div>

    <!-- Center GIF -->
    <div class="center-container">
        <img src="humbleraja.gif" alt="Humble Raja Logo">
    </div>

    <!-- Right Edge: INSTAGRAM -->
    <div class="edge-text right-edge syncopate-bold">
        <a href="https://www.instagram.com/humbleraja" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
    </div>

    <!-- Bottom Edge: अंडर कंस्ट्रक्शन -->
    <div class="edge-text bottom-edge palanquin-bold">
        अंडर कंस्ट्रक्शन - UNDER CONSTRUCTION - अंडर कंस्ट्रक्शन
    </div>

</body>
</html>
